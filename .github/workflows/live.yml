name: Live Stream HLS to YouTube

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  stream:
    runs-runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Start Live Streaming from HLS
      run: |
        ffmpeg -re -i "${{ secrets.HTTP_URL }}" -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 \
        -c:v copy \
        -c:a aac -b:a 128k \
        -map 0:v:0 -map 1:a:0 \
        -f flv "rtmp://://youtube.com{{ secrets.YOUTUBE_STREAM_KEY }}"
