    - name: CCTV ke YouTube 
      run: |
        timeout 20700s bash -c '
        while true; do 
          ffmpeg -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5 -fflags nobuffer -flags low_delay \
            -i "${{ secrets.URL_CCTV }}" \
            -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 \
            -c:v libx264 -preset veryfast -pix_fmt yuv420p -g 60 -b:v 2000k \
            -c:a aac -b:a 128k \
            -map 0:v:0 -map 1:a:0 \
            -f flv "rtmp://://youtube.com{{ secrets.STREAM_KEY }}"; 
          
          echo "Streaming terputus atau gagal, mencoba menghubungkan kembali dalam 5 detik..."; 
          sleep 5; 
        done' || true
